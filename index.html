<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🌲 树洞 · 匿名的角落</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;700&display=swap');
  
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Noto Sans SC', -apple-system, sans-serif;
    background: #0f0f1a;
    color: #e0e0e0;
    min-height: 100vh;
  }

  /* 背景粒子效果 */
  .bg-particles {
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    overflow: hidden;
    pointer-events: none;
    z-index: 0;
  }
  .particle {
    position: absolute;
    width: 4px; height: 4px;
    background: rgba(255,255,255,0.08);
    border-radius: 50%;
    animation: float linear infinite;
  }
  @keyframes float {
    0% { transform: translateY(100vh) scale(0); opacity: 0; }
    10% { opacity: 1; }
    90% { opacity: 0.3; }
    100% { transform: translateY(-10vh) scale(1); opacity: 0; }
  }

  /* Header */
  header {
    position: relative;
    z-index: 1;
    text-align: center;
    padding: 60px 20px 30px;
    background: linear-gradient(180deg, rgba(79,70,229,0.15) 0%, transparent 100%);
  }
  header h1 {
    font-size: 2.5rem;
    font-weight: 700;
    background: linear-gradient(135deg, #818cf8, #c084fc);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    letter-spacing: 2px;
  }
  header p {
    margin-top: 10px;
    color: #888;
    font-size: 0.95rem;
    font-weight: 300;
  }

  /* Main */
  .container {
    position: relative;
    z-index: 1;
    max-width: 720px;
    margin: 0 auto;
    padding: 0 20px 60px;
  }

  /* 写树洞 */
  .post-box {
    background: rgba(255,255,255,0.04);
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 16px;
    padding: 24px;
    margin-bottom: 30px;
    backdrop-filter: blur(10px);
    transition: border-color 0.3s;
  }
  .post-box:focus-within {
    border-color: rgba(129,140,248,0.4);
  }
  .post-box textarea {
    width: 100%;
    min-height: 100px;
    background: transparent;
    border: none;
    outline: none;
    color: #e0e0e0;
    font-size: 0.95rem;
    font-family: inherit;
    resize: vertical;
    line-height: 1.7;
  }
  .post-box textarea::placeholder {
    color: #555;
  }
  .post-footer {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-top: 16px;
    padding-top: 16px;
    border-top: 1px solid rgba(255,255,255,0.06);
  }
  .char-count {
    font-size: 0.8rem;
    color: #555;
  }
  .char-count.warn { color: #f59e0b; }
  .char-count.over { color: #ef4444; }
  .post-btn {
    padding: 10px 28px;
    border: none;
    border-radius: 10px;
    background: linear-gradient(135deg, #6366f1, #8b5cf6);
    color: white;
    font-size: 0.9rem;
    font-weight: 500;
    cursor: pointer;
    transition: all 0.3s;
    font-family: inherit;
  }
  .post-btn:hover {
    transform: translateY(-1px);
    box-shadow: 0 6px 20px rgba(99,102,241,0.35);
  }
  .post-btn:disabled {
    opacity: 0.4;
    cursor: not-allowed;
    transform: none;
    box-shadow: none;
  }

  /* 筛选栏 */
  .filter-bar {
    display: flex;
    gap: 10px;
    margin-bottom: 20px;
    flex-wrap: wrap;
  }
  .filter-btn {
    padding: 6px 16px;
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 20px;
    background: transparent;
    color: #888;
    font-size: 0.85rem;
    cursor: pointer;
    transition: all 0.25s;
    font-family: inherit;
  }
  .filter-btn:hover { border-color: rgba(129,140,248,0.3); color: #bbb; }
  .filter-btn.active {
    background: rgba(99,102,241,0.15);
    border-color: #6366f1;
    color: #818cf8;
  }

  /* 卡片 */
  .feed { display: flex; flex-direction: column; gap: 16px; }
  .empty-state {
    text-align: center;
    padding: 60px 20px;
    color: #555;
  }
  .empty-state .emoji { font-size: 3rem; margin-bottom: 12px; }
  .empty-state p { font-size: 0.9rem; line-height: 1.6; }

  .card {
    background: rgba(255,255,255,0.03);
    border: 1px solid rgba(255,255,255,0.06);
    border-radius: 14px;
    padding: 20px;
    transition: all 0.3s;
    animation: fadeIn 0.4s ease;
  }
  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(12px); }
    to { opacity: 1; transform: translateY(0); }
  }
  .card:hover {
    border-color: rgba(255,255,255,0.1);
    background: rgba(255,255,255,0.05);
  }
  .card-meta {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 10px;
  }
  .card-author {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 0.85rem;
  }
  .avatar {
    width: 28px; height: 28px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 0.8rem;
    font-weight: 500;
    color: white;
    flex-shrink: 0;
  }
  .card-time {
    font-size: 0.75rem;
    color: #555;
  }
  .card-content {
    line-height: 1.8;
    font-size: 0.95rem;
    word-break: break-word;
  }
  .card-tag {
    display: inline-block;
    padding: 2px 10px;
    border-radius: 12px;
    font-size: 0.75rem;
    margin-top: 10px;
    background: rgba(255,255,255,0.05);
    color: #777;
  }
  .card-actions {
    display: flex;
    gap: 20px;
    margin-top: 14px;
    padding-top: 12px;
    border-top: 1px solid rgba(255,255,255,0.04);
  }
  .action-btn {
    display: flex;
    align-items: center;
    gap: 5px;
    background: none;
    border: none;
    color: #555;
    font-size: 0.8rem;
    cursor: pointer;
    transition: color 0.2s;
    font-family: inherit;
    padding: 2px 4px;
  }
  .action-btn:hover { color: #aaa; }
  .action-btn.liked { color: #f472b6; }
  .action-btn.liked:hover { color: #ec4899; }

  /* Toast */
  .toast {
    position: fixed;
    bottom: 30px;
    left: 50%;
    transform: translateX(-50%) translateY(80px);
    background: rgba(30,30,50,0.95);
    color: #e0e0e0;
    padding: 12px 24px;
    border-radius: 12px;
    font-size: 0.85rem;
    backdrop-filter: blur(10px);
    border: 1px solid rgba(255,255,255,0.08);
    opacity: 0;
    transition: all 0.4s;
    z-index: 100;
    pointer-events: none;
    white-space: nowrap;
  }
  .toast.show {
    opacity: 1;
    transform: translateX(-50%) translateY(0);
  }

  /* Responsive */
  @media (max-width: 500px) {
    header h1 { font-size: 1.8rem; }
    header { padding: 40px 16px 20px; }
    .post-box { padding: 16px; }
    .container { padding: 0 16px 40px; }
  }

  /* 滚动条 */
  ::-webkit-scrollbar { width: 6px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.08); border-radius: 3px; }
  ::-webkit-scrollbar-thumb:hover { background: rgba(255,255,255,0.15); }
</style>
</head>
<body>

<div class="bg-particles" id="particles"></div>

<header>
  <h1>🌲 树洞</h1>
  <p>说你想说的，没人知道你是谁</p>
</header>

<div class="container">
  <div class="post-box">
    <textarea id="postInput" maxlength="500" placeholder="写下你想说的话… 秘密、心事、吐槽，什么都行。"></textarea>
    <div class="post-footer">
      <span class="char-count" id="charCount">0 / 500</span>
      <button class="post-btn" id="postBtn">🌱 扔进树洞</button>
    </div>
  </div>

  <div class="filter-bar">
    <button class="filter-btn active" data-filter="all">✨ 全部</button>
    <button class="filter-btn" data-filter="recent">🕐 最新</button>
    <button class="filter-btn" data-filter="hot">🔥 最热</button>
  </div>

  <div class="feed" id="feed"></div>
</div>

<div class="toast" id="toast"></div>

<script>
// ========== 💾 数据 ==========
const STORAGE_KEY = 'treehole_posts';
let posts = loadPosts();
let currentFilter = 'all';

// ========== 🛠️ 工具 ==========
function loadPosts() {
  try {
    return JSON.parse(localStorage.getItem(STORAGE_KEY)) || [];
  } catch { return []; }
}

function savePosts() {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(posts));
}

function generateId() {
  return Date.now().toString(36) + Math.random().toString(36).slice(2,6);
}

function timeAgo(dateStr) {
  const diff = Date.now() - new Date(dateStr).getTime();
  const mins = Math.floor(diff / 60000);
  if (mins < 1) return '刚刚';
  if (mins < 60) return mins + '分钟前';
  const hours = Math.floor(mins / 60);
  if (hours < 24) return hours + '小时前';
  const days = Math.floor(hours / 24);
  if (days < 30) return days + '天前';
  return new Date(dateStr).toLocaleDateString('zh-CN');
}

function getRandomColor() {
  const colors = [
    '#6366f1','#8b5cf6','#ec4899','#f43f5e',
    '#f59e0b','#10b981','#06b6d4','#3b82f6',
    '#a855f7','#ef4444','#14b8a6','#d946ef'
  ];
  return colors[Math.floor(Math.random() * colors.length)];
}

function getAnonName() {
  const names = [
    '匿名的小猫','树洞里的星星','藏在云里的人','路过的人',
    '深夜独白','一个影子','沉默的鱼','风的孩子',
    '失眠患者','月亮邮递员','某个角落','第三棵树',
    '迷雾行者','蓝色鲸鱼','昨夜星辰','无名访客',
    '远方的歌','半杯月光','哑巴诗人','白日梦想家'
  ];
  return names[Math.floor(Math.random() * names.length)];
}

function toast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(el._timer);
  el._timer = setTimeout(() => el.classList.remove('show'), 2200);
}

// ========== 🎨 粒子背景 ==========
function initParticles() {
  const container = document.getElementById('particles');
  for (let i = 0; i < 40; i++) {
    const p = document.createElement('div');
    p.className = 'particle';
    p.style.left = Math.random() * 100 + '%';
    p.style.width = p.style.height = (2 + Math.random() * 4) + 'px';
    p.style.animationDuration = (15 + Math.random() * 25) + 's';
    p.style.animationDelay = (Math.random() * 30) + 's';
    container.appendChild(p);
  }
}
initParticles();

// ========== 📝 发帖 ==========
document.getElementById('postInput').addEventListener('input', function() {
  const len = this.value.length;
  const max = 500;
  const el = document.getElementById('charCount');
  el.textContent = len + ' / ' + max;
  el.className = 'char-count' + (len > 400 ? ' warn' : '') + (len >= max ? ' over' : '');
  document.getElementById('postBtn').disabled = len === 0 || len > max;
});

document.getElementById('postBtn').addEventListener('click', function() {
  const input = document.getElementById('postInput');
  const text = input.value.trim();
  if (!text) return;

  const post = {
    id: generateId(),
    content: text,
    author: getAnonName(),
    color: getRandomColor(),
    time: new Date().toISOString(),
    likes: 0,
    liked: false
  };

  posts.unshift(post);
  savePosts();
  input.value = '';
  document.getElementById('charCount').textContent = '0 / 500';
  this.disabled = true;
  renderFeed();
  toast('🌱 你的秘密已藏进树洞');
});

// ========== 🎯 筛选 ==========
document.querySelectorAll('.filter-btn').forEach(btn => {
  btn.addEventListener('click', function() {
    document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
    this.classList.add('active');
    currentFilter = this.dataset.filter;
    renderFeed();
  });
});

function getFilteredPosts() {
  let list = [...posts];
  if (currentFilter === 'recent') {
    list.sort((a, b) => new Date(b.time) - new Date(a.time));
  } else if (currentFilter === 'hot') {
    list.sort((a, b) => b.likes - a.likes);
  }
  return list;
}

// ========== 🖼️ 渲染 ==========
function renderFeed() {
  const feed = document.getElementById('feed');
  const list = getFilteredPosts();

  if (list.length === 0) {
    feed.innerHTML = `
      <div class="empty-state">
        <div class="emoji">🍃</div>
        <p>树洞还是空的。<br>写下第一个秘密吧。</p>
      </div>
    `;
    return;
  }

  feed.innerHTML = list.map(post => `
    <div class="card" data-id="${post.id}">
      <div class="card-meta">
        <div class="card-author">
          <div class="avatar" style="background:${post.color}">匿</div>
          <span>${post.author}</span>
        </div>
        <span class="card-time">${timeAgo(post.time)}</span>
      </div>
      <div class="card-content">${escapeHtml(post.content)}</div>
      <span class="card-tag">#匿名投稿</span>
      <div class="card-actions">
        <button class="action-btn ${post.liked ? 'liked' : ''}" onclick="toggleLike('${post.id}')">
          ${post.liked ? '❤️' : '🤍'} <span>${post.likes}</span>
        </button>
      </div>
    </div>
  `).join('');
}

function escapeHtml(text) {
  const div = document.createElement('div');
  div.textContent = text;
  return div.innerHTML.replace(/\n/g, '<br>');
}

// ========== ❤️ 点赞 ==========
function toggleLike(id) {
  const post = posts.find(p => p.id === id);
  if (!post) return;
  post.liked = !post.liked;
  post.likes += post.liked ? 1 : -1;
  savePosts();
  renderFeed();
}

// ========== 🚀 初次渲染 ==========
renderFeed();
</script>
</body>
</html>
